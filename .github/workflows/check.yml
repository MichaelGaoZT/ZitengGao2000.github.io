name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated pages
        run: python3 scripts/build.py --check
      - name: Check links and page structure
        run: python3 scripts/check_site.py
